{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>To-Do lists</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="{% static 'css/base.css' %}" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="{% static 'js/accounts.js' %}"></script>
    </head>
    <body>
        <nav class="navbar navbar-light bg-light mb-4">
            <div class="container">
                <span class="navbar-brand">To-Do Lists</span>
                <div id="auth-section">
                    {% if user.is_authenticated %}
                        <span>
                            {{ user.email }}
                            <a id="login" class="navbar-link" href="/accounts/logout/">Sign out</a>
                        </span>
                    {% else %}
                        <a id="login" class="navbar-link" href="#">Sign in</a>
                    {% endif %}
                </div>
            </div>
        </nav>

        <!-- Email Login Modal -->
        <div id="login-modal" class="modal" tabindex="-1" style="display: none;">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">登录</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">邮箱地址</label>
                                <input type="email" class="form-control" id="email" placeholder="your-email@example.com" required>
                                <div class="form-text">我们会发送登录链接到您的邮箱</div>
                            </div>
                            <button type="submit" class="btn btn-primary">发送登录链接</button>
                        </form>
                        <div id="login-message" class="mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>

        <h1 class="display-4 text-center mt-4">To-Do Lists</h1>

        {% block content %}
        {% endblock %}

        </script>
    </body>
</html>
